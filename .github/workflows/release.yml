name: Releaser
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pantry-pm/pantry/packages/action@v0.11.153
        with:
          version: '0.11.109'
          install: 'false'
          packages: bun.com@1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run lint
      - run: bun run build
      - run: pantry publish --npm --access public .
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: stacksjs/action-releaser@v1.2.11
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
